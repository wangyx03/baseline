<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Permission Management
    </title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='navbar.css') }}"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f6f8;

            color: #1f2329;
        }


        .page {

            max-width: 1000px;

            margin: 0 auto;

            padding:
                36px
                24px
                60px;
        }


        h1 {

            margin:
                0
                0
                8px;

            font-size: 30px;

            font-weight: 700;
        }


        .subtitle {

            margin-bottom: 28px;

            color: #6b7280;

            font-size: 15px;
        }


        .panel {

            background: #ffffff;

            border:
                1px
                solid
                #e5e7eb;

            border-radius: 14px;

            padding: 24px;

            margin-bottom: 22px;

            box-shadow:
                0
                2px
                8px
                rgba(
                    0,
                    0,
                    0,
                    0.04
                );
        }


        .panel-title {

            margin-bottom: 18px;

            font-size: 17px;

            font-weight: 700;
        }


        .field-label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #4b5563;
        }


        .user-select {

            width: 100%;

            height: 44px;

            padding:
                0
                12px;

            border:
                1px
                solid
                #d1d5db;

            border-radius: 8px;

            background: #ffffff;

            font-size: 15px;

            color: #1f2329;
        }


        .user-select:focus {

            outline: none;

            border-color: #2563eb;

            box-shadow:
                0
                0
                0
                3px
                rgba(
                    37,
                    99,
                    235,
                    0.1
                );
        }


        .user-info {
            display: none;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 16px;
            margin-top: 20px;
        }


        .info-item {

            padding: 14px;

            background: #f9fafb;

            border-radius: 8px;
        }


        .info-label {

            margin-bottom: 5px;

            font-size: 12px;

            color: #6b7280;
        }


        .info-value {

            font-size: 15px;

            font-weight: 600;

            overflow-wrap: anywhere;
        }


        .permissions {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 12px;
        }


        .permission-item {

            display: flex;

            align-items: center;

            gap: 12px;

            min-height: 64px;

            padding:
                14px
                16px;

            border:
                1px
                solid
                #e5e7eb;

            border-radius: 10px;

            cursor: pointer;

            transition:
                border-color 0.15s,
                background 0.15s;
        }


        .permission-item:hover {

            border-color: #c7d2fe;

            background: #f9fafb;
        }

        .permission-item:has(
            input:disabled
        ) {
            background: #f7f8fa;
        }

        .permission-item:has(
            input:disabled
        ) input {
            cursor: not-allowed;
        }

        .permission-item input {

            width: 18px;

            height: 18px;

            margin: 0;

            cursor: pointer;
        }


        .permission-name {

            font-size: 15px;

            font-weight: 600;
        }


        .permission-id {

            margin-top: 3px;

            font-size: 12px;

            color: #9ca3af;
        }


        .actions {

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 14px;

            margin-top: 22px;
        }


        .save-button {

            min-width: 150px;

            height: 42px;

            padding:
                0
                18px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }


        .save-button:hover {

            background: #1d4ed8;
        }


        .save-button:disabled {

            background: #9ca3af;

            cursor: not-allowed;
        }


        .message {

            min-height: 20px;

            font-size: 14px;
        }


        .message.success {

            color: #15803d;
        }


        .message.error {

            color: #dc2626;
        }


        .loading {

            opacity: 0.55;

            pointer-events: none;
        }


        @media (
            max-width: 700px
        ) {

            .permissions {

                grid-template-columns:
                    1fr;
            }


            .user-info {

                grid-template-columns:
                    1fr;
            }


            .page {

                padding:
                    24px
                    16px
                    50px;
            }
        }

    </style>

</head>


<body>


{% include "navbar.html" %}


<div class="page">


    <h1>
        Permission Management
    </h1>


    <div class="subtitle">
        Manage module access for system users.
    </div>



    <!-- ========================= -->
    <!-- User Selection -->
    <!-- ========================= -->

    <div class="panel">

        <div class="panel-title">
            User
        </div>


        <label
            class="field-label"
            for="userSelect"
        >
            Select User
        </label>


        <select
            id="userSelect"
            class="user-select"
        >

            <option value="">
                Select a user...
            </option>


            {% for user in users %}

                <option
                    value="{{ user.user_id }}"
                >
                    {{ user.username }}

                    {% if user.staff_name %}
                        — {{ user.staff_name }}
                    {% endif %}

                </option>

            {% endfor %}

        </select>


        <div
            id="userInfo"
            class="user-info"
        >

            <div class="info-item">

                <div class="info-label">
                    Username
                </div>

                <div
                    id="infoUsername"
                    class="info-value"
                >
                    -
                </div>

            </div>


            <div class="info-item">

                <div class="info-label">
                    Account Status
                </div>

                <div
                    id="infoStatus"
                    class="info-value"
                >
                    -
                </div>

            </div>

        </div>

    </div>



    <!-- ========================= -->
    <!-- Permissions -->
    <!-- ========================= -->

    <div
        id="permissionPanel"
        class="panel"
    >

        <div class="panel-title">
            Module Access
        </div>


        <div class="permissions">

            {% for module in modules %}

                <label
                    class="permission-item"
                >

                    <input
                        type="checkbox"
                        class="module-checkbox"
                        value="{{ module.module_id }}"
                        disabled
                    >


                    <div>

                        <div class="permission-name">
                            {{ module.module_name }}
                        </div>

                        <div class="permission-id">
                            Module {{ module.module_id }}
                        </div>

                    </div>

                </label>

            {% endfor %}

        </div>


        <div class="actions">

            <div
                id="message"
                class="message"
            ></div>


            <button
                id="saveButton"
                class="save-button"
                type="button"
                disabled
            >
                Save Permissions
            </button>

        </div>

    </div>


</div>



<script>

    const userSelect =
        document.getElementById(
            "userSelect"
        );


    const userInfo =
        document.getElementById(
            "userInfo"
        );


    const infoUsername =
        document.getElementById(
            "infoUsername"
        );


    const infoStatus =
        document.getElementById(
            "infoStatus"
        );


    const permissionPanel =
        document.getElementById(
            "permissionPanel"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const checkboxes =
        document.querySelectorAll(
            ".module-checkbox"
        );


    let selectedUserId = null;



    // =========================
    // Reset
    // =========================

    function resetPage() {

        selectedUserId = null;

        userInfo.style.display =
            "none";


        checkboxes.forEach(
            checkbox => {

                checkbox.checked = false;

                checkbox.disabled = true;

            }
        );


        saveButton.disabled = true;

        message.textContent = "";

        message.className =
            "message";
    }



    // =========================
    // Load User Permissions
    // =========================

    async function loadUserPermissions(
        userId
    ) {

        permissionPanel.classList.add(
            "loading"
        );


        message.textContent = "";

        message.className =
            "message";


        try {

            const response =
                await fetch(
                    `/api/permission-management/${userId}`
                );


            const data =
                await response.json();


            if (
                !response.ok
                ||
                !data.success
            ) {

                throw new Error(
                    data.message
                    ||
                    "Unable to load permissions."
                );
            }


            selectedUserId =
                userId;


            // =========================
            // User Info
            // =========================

            infoUsername.textContent =
                data.user.username;


            infoStatus.textContent =
                data.user.is_active
                ? "Active"
                : "Inactive";


            userInfo.style.display =
                "grid";


            // =========================
            // Permissions
            // =========================

            checkboxes.forEach(
                checkbox => {

                    const moduleId =
                        Number(
                            checkbox.value
                        );


                    checkbox.checked =
                        data.permissions[
                            moduleId
                        ]
                        === true;


                    const isPermissionManagement =
                        moduleId
                        ===
                        Number(
                            data.permission_management_module_id
                        );


                    const alreadyHasPermissionManagement =
                        data.permissions[
                            moduleId
                        ]
                        === true;


                    if (
                        isPermissionManagement
                        &&
                        alreadyHasPermissionManagement
                    ) {

                        checkbox.checked = true;

                        checkbox.disabled = true;

                    }
                    else {

                        checkbox.disabled = false;

                    }

                }
            );


            saveButton.disabled =
                false;

        }

        catch (error) {

            resetPage();

            message.textContent =
                error.message;

            message.className =
                "message error";

        }

        finally {

            permissionPanel.classList.remove(
                "loading"
            );
        }
    }



    // =========================
    // User Changed
    // =========================

    userSelect.addEventListener(
        "change",
        function () {

            const userId =
                this.value;


            if (!userId) {

                resetPage();

                return;
            }


            loadUserPermissions(
                userId
            );

        }
    );



    // =========================
    // Save Permissions
    // =========================

    saveButton.addEventListener(
        "click",
        async function () {

            if (!selectedUserId) {
                return;
            }


            const moduleIds = [];


            checkboxes.forEach(
                checkbox => {

                    if (
                        checkbox.checked
                    ) {

                        moduleIds.push(
                            Number(
                                checkbox.value
                            )
                        );
                    }

                }
            );


            saveButton.disabled =
                true;


            permissionPanel.classList.add(
                "loading"
            );


            message.textContent =
                "";


            try {

                const response =
                    await fetch(
                        `/api/permission-management/${selectedUserId}`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                module_ids:
                                    moduleIds
                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok
                    ||
                    !data.success
                ) {

                    throw new Error(
                        data.message
                        ||
                        "Unable to save permissions."
                    );
                }


                message.textContent =
                    "Permissions saved.";

                message.className =
                    "message success";

            }

            catch (error) {

                message.textContent =
                    error.message;

                message.className =
                    "message error";

            }

            finally {

                permissionPanel.classList.remove(
                    "loading"
                );

                saveButton.disabled =
                    false;
            }

        }
    );



    // =========================
    // Initial State
    // =========================

    resetPage();

</script>


</body>

</html>
