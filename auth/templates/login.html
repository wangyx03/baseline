<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f5f5f5;

            min-height:
                100vh;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

        }


        .login-box {

            width:
                400px;

            background:
                white;

            padding:
                40px;

            border-radius:
                8px;

            box-shadow:
                0
                4px
                20px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

        }


        h1 {

            margin-top:
                0;

            margin-bottom:
                30px;

            font-size:
                32px;

        }


        label {

            display:
                block;

            font-weight:
                bold;

            margin-bottom:
                8px;

        }


        input {

            width:
                100%;

            padding:
                12px;

            font-size:
                16px;

            border:
                1px
                solid
                #aaa;

            border-radius:
                4px;

        }


        input:focus {

            outline:
                2px
                solid
                #333;

        }


        .username-input {

            margin-bottom:
                20px;

        }


        /* ========================= */
        /* Password */
        /* ========================= */

        .password-row {

            position:
                relative;

            margin-bottom:
                20px;

        }


        .password-row input {

            width:
                100%;

            padding-right:
                46px;

        }


        /* ========================= */
        /* Eye Button */
        /* ========================= */

        .password-toggle {

            position:
                absolute;

            top:
                50%;

            right:
                11px;

            transform:
                translateY(-50%);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                28px;

            height:
                28px;

            padding:
                0;

            margin:
                0;

            border:
                none;

            background:
                transparent;

            color:
                #6b7280;

            cursor:
                pointer;

        }


        .password-toggle:hover {

            color:
                #111111;

            background:
                transparent;

        }


        .password-toggle:focus {

            outline:
                none;

        }


        .password-toggle svg {

            width:
                20px;

            height:
                20px;

            pointer-events:
                none;

        }


        /* ========================= */
        /* Login Button */
        /* ========================= */

        .login-button {

            width:
                100%;

            padding:
                12px;

            font-size:
                16px;

            font-weight:
                bold;

            cursor:
                pointer;

            border:
                none;

            border-radius:
                4px;

            background:
                #111111;

            color:
                white;

        }


        .login-button:hover {

            background:
                #333333;

        }


        /* ========================= */
        /* Error */
        /* ========================= */

        .error {

            background:
                #ffeaea;

            color:
                #c00000;

            padding:
                10px;

            margin-bottom:
                20px;

            border-radius:
                4px;

        }


    </style>

</head>


<body>


<div class="login-box">


    <h1>
        Login
    </h1>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">


        <!-- ========================= -->
        <!-- Username -->
        <!-- ========================= -->

        <label for="username">

            Username

        </label>


        <input

            id="username"

            class="username-input"

            name="username"

            type="text"

            autocomplete="username"

            required

            autofocus

        >


        <!-- ========================= -->
        <!-- Password -->
        <!-- ========================= -->

        <label for="password">

            Password

        </label>


        <div class="password-row">


            <input

                id="password"

                name="password"

                type="password"

                autocomplete="current-password"

                required

            >


            <button

                type="button"

                class="password-toggle"

                id="passwordToggle"

                onclick="togglePassword()"

                aria-label="Show password"

                title="Show password"

            >


                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="
                            M2 12
                            s3.5-7 10-7
                            10 7 10 7
                            -3.5 7-10 7
                            S2 12 2 12
                        "
                    ></path>

                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    ></circle>

                </svg>


            </button>


        </div>


        <!-- ========================= -->
        <!-- Login -->
        <!-- ========================= -->

        <button

            type="submit"

            class="login-button"

        >

            Login

        </button>


    </form>


</div>


<script>


    function getEyeIcon() {

        return `

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="
                        M2 12
                        s3.5-7 10-7
                        10 7 10 7
                        -3.5 7-10 7
                        S2 12 2 12
                    "
                ></path>

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                ></circle>

            </svg>

        `;

    }


    function getEyeOffIcon() {

        return `

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M3 3l18 18"
                ></path>

                <path
                    d="
                        M10.6 10.6
                        a2 2 0 0 0
                        2.8 2.8
                    "
                ></path>

                <path
                    d="
                        M9.9 4.2
                        A10.5 10.5 0 0 1
                        12 4

                        c6.5 0
                        10 8
                        10 8

                        a18.8 18.8 0 0 1
                        -2.1 3.2
                    "
                ></path>

                <path
                    d="
                        M6.6 6.6

                        C3.7 8.5
                        2 12
                        2 12

                        s3.5 8
                        10 8

                        a9.8 9.8 0 0 0
                        4.1-.9
                    "
                ></path>

            </svg>

        `;

    }


    function togglePassword() {


        const passwordInput =

            document.getElementById(
                "password"
            );


        const button =

            document.getElementById(
                "passwordToggle"
            );


        if (
            passwordInput.type
            ===
            "password"
        ) {


            passwordInput.type =
                "text";


            button.innerHTML =
                getEyeOffIcon();


            button.setAttribute(
                "aria-label",
                "Hide password"
            );


            button.setAttribute(
                "title",
                "Hide password"
            );


        }
        else {


            passwordInput.type =
                "password";


            button.innerHTML =
                getEyeIcon();


            button.setAttribute(
                "aria-label",
                "Show password"
            );


            button.setAttribute(
                "title",
                "Show password"
            );


        }


        passwordInput.focus();


    }


</script>


</body>

</html>
