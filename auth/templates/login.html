<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f5f5f5;

            min-height:
                100vh;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

        }


        .login-box {

            width:
                400px;

            background:
                white;

            padding:
                40px;

            border-radius:
                8px;

            box-shadow:
                0
                4px
                20px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

        }


        h1 {

            margin-top:
                0;

            margin-bottom:
                30px;

            font-size:
                32px;

        }


        label {

            display:
                block;

            font-weight:
                bold;

            margin-bottom:
                8px;

        }


        input {

            width:
                100%;

            padding:
                12px;

            font-size:
                16px;

            border:
                1px
                solid
                #aaa;

            border-radius:
                4px;

        }


        input:focus {

            outline:
                2px
                solid
                #333;

        }


        .username-input {

            margin-bottom:
                20px;

        }


        .password-row {

            display:
                flex;

            gap:
                8px;

            margin-bottom:
                20px;

        }


        .password-row input {

            flex:
                1;

            min-width:
                0;

        }


        button {

            font-size:
                16px;

            font-weight:
                bold;

            cursor:
                pointer;

            border:
                none;

            border-radius:
                4px;

        }


        .show-password-button {

            width:
                80px;

            flex-shrink:
                0;

            padding:
                0
                10px;

            background:
                #eeeeee;

            color:
                #111111;

            border:
                1px
                solid
                #aaaaaa;

        }


        .show-password-button:hover {

            background:
                #dddddd;

        }


        .login-button {

            width:
                100%;

            padding:
                12px;

            background:
                #111111;

            color:
                white;

        }


        .login-button:hover {

            background:
                #333333;

        }


        .error {

            background:
                #ffeaea;

            color:
                #c00000;

            padding:
                10px;

            margin-bottom:
                20px;

            border-radius:
                4px;

        }


    </style>

</head>


<body>


<div class="login-box">


    <h1>
        Login
    </h1>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">


        <label for="username">

            Username

        </label>


        <input

            id="username"

            class="username-input"

            name="username"

            type="text"

            autocomplete="username"

            required

            autofocus

        >


        <label for="password">

            Password

        </label>


        <div class="password-row">


            <input

                id="password"

                name="password"

                type="password"

                autocomplete="current-password"

                required

            >


            <button

                type="button"

                class="show-password-button"

                onclick="togglePassword()"

            >

                Show

            </button>


        </div>


        <button

            type="submit"

            class="login-button"

        >

            Login

        </button>


    </form>


</div>


<script>


    function togglePassword() {


        const passwordInput =

            document.getElementById(
                "password"
            );


        const button =

            document.querySelector(
                ".show-password-button"
            );


        if (
            passwordInput.type
            ===
            "password"
        ) {


            passwordInput.type =
                "text";


            button.textContent =
                "Hide";


        }
        else {


            passwordInput.type =
                "password";


            button.textContent =
                "Show";


        }


        passwordInput.focus();


    }


</script>


</body>

</html>
