<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Weekly Availability
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='navbar.css') }}"
    >

     <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f6f8;

            color: #1f2329;
        }


        .page {

            max-width: 1250px;

            margin: 35px auto;

            padding: 0 20px;
        }


        .card {

            background: white;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.06);
        }


        h1 {

            margin: 0;

            font-size: 30px;
        }


        .subtitle {

            margin-top: 8px;

            color: #646a73;

            font-size: 14px;
        }


        /* =========================
           Staff
        ========================= */

        .controls {

            display: flex;

            flex-wrap: wrap;

            align-items: end;

            gap: 20px;

            margin-top: 28px;

            margin-bottom: 28px;
        }


        .control-group {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        label {

            font-size: 13px;

            font-weight: 600;

            color: #646a73;
        }


        .employee-name {

            min-width: 210px;

            padding: 11px 14px;

            border:
                1px solid
                #d9dce1;

            border-radius: 7px;

            background: #f7f8fa;

            font-size: 15px;

            font-weight: 600;
        }


        /* =========================
           Buttons
        ========================= */

        button {

            border: none;

            border-radius: 7px;

            padding: 10px 16px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }


        button:hover {

            opacity: 0.88;
        }


        button:disabled {

            opacity: 0.45;

            cursor: not-allowed;
        }


        .secondary-button {

            background: #f0f1f3;

            color: #1f2329;
        }


        /* =========================
           Week
        ========================= */

        .week-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 18px;
        }


        .week-title {

            font-size: 19px;

            font-weight: 700;
        }


        .week-buttons {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }


        /* =========================
           Table
        ========================= */

        .table-wrapper {

            overflow-x: auto;
        }


        table {

            width: 100%;

            min-width: 1000px;

            border-collapse: separate;

            border-spacing: 0;

            border:
                1px solid
                #dfe1e5;

            border-radius: 9px;

            overflow: hidden;
        }


        th,
        td {

            border-right:
                1px solid
                #e5e6e8;

            border-bottom:
                1px solid
                #e5e6e8;

            text-align: center;
        }


        th:last-child,
        td:last-child {

            border-right: none;
        }


        tr:last-child td {

            border-bottom: none;
        }


        th {

            height: 68px;

            background: #f7f8fa;

            font-size: 14px;

            font-weight: 700;
        }


        .day-date {

            display: block;

            margin-top: 4px;

            font-size: 12px;

            font-weight: normal;

            color: #8f959e;
        }


        .time-cell {

            width: 125px;

            padding: 0 8px;

            background: #fafafa;

            font-size: 13px;

            font-weight: 600;

            color: #646a73;
        }


        /* =========================
           Availability cells
        ========================= */

        .availability-cell {

            height: 57px;

            background: #f2f3f5;

            cursor: pointer;

            user-select: none;

            transition:
                background 0.12s,
                transform 0.05s;
        }


        .availability-cell:hover {

            background: #e7e9ed;
        }


        .availability-cell:active {

            transform: scale(0.985);
        }


        .availability-cell.available {

            background: #d8f3df;
        }


        .availability-cell.available:hover {

            background: #c5ebcf;
        }


        .availability-cell.locked {

            cursor: default;
        }


        .availability-cell.locked:hover {

            background: #f2f3f5;
        }


        .availability-cell.available.locked:hover {

            background: #d8f3df;
        }


        .cell-text {

            font-size: 12px;

            font-weight: 600;

            color: #237b3b;
        }


        /* =========================
           Day actions
        ========================= */

        .day-actions td {

            padding: 8px 4px;

            background: #fafafa;
        }


        .day-action {

            padding: 6px 9px;

            font-size: 11px;

            background: #eef0f3;

            color: #646a73;
        }


        /* =========================
           Bottom
        ========================= */

        .bottom-area {

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 20px;

            margin-top: 24px;
        }


        .legend {

            display: flex;

            gap: 20px;

            color: #646a73;

            font-size: 13px;
        }


        .legend-item {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .legend-box {

            width: 17px;

            height: 17px;

            border-radius: 4px;
        }


        .legend-available {

            background: #d8f3df;
        }


        .legend-unavailable {

            background: #f2f3f5;

            border:
                1px solid
                #ddd;
        }


        .save-button {

            min-width: 205px;

            background: #3370ff;

            color: white;

            padding: 12px 24px;
        }


        .modify-button {

            background: #f0f1f3;

            color: #1f2329;
        }


        /* =========================
           Status
        ========================= */

        .submission-status {

            display: none;

            margin-top: 16px;

            padding: 10px 14px;

            border-radius: 7px;

            background: #f7f8fa;

            color: #646a73;

            font-size: 13px;
        }


        .submission-status.visible {

            display: block;
        }


        /* =========================
           Message
        ========================= */

        #message {

            display: none;

            margin-top: 18px;

            padding: 12px 15px;

            border-radius: 7px;

            font-size: 14px;
        }


        #message.success {

            display: block;

            background: #e8f7ed;

            color: #237b3b;
        }


        #message.error {

            display: block;

            background: #fdecec;

            color: #c62828;
        }


        /* =========================
           Mobile
        ========================= */

        @media (
            max-width: 750px
        ) {

            .page {

                margin: 18px auto;

                padding: 0 10px;
            }


            .card {

                padding: 18px;
            }


            .controls {

                align-items: stretch;

                flex-direction: column;
            }


            .employee-name {

                width: 100%;
            }


            .week-bar {

                align-items: flex-start;

                flex-direction: column;
            }


            .bottom-area {

                flex-direction: column;

                align-items: stretch;
            }


            .save-button {

                width: 100%;
            }

        }

    </style>

</head>


<body>

{% include "navbar.html" %}

<div class="page">


    <div class="card">


        <h1>
            Weekly Availability
        </h1>


        <div class="subtitle">

            Select all times when you are available to work.

            Green means available.

        </div>



        <!-- Staff -->

        <div class="controls">


            <div class="control-group">

                <label>
                    Staff
                </label>


                <div class="employee-name">

                    {{ staff_name }}

                </div>

            </div>



            <button
                class="secondary-button edit-control"
                onclick="selectAll()"
            >
                Available All
            </button>



            <button
                class="secondary-button edit-control"
                onclick="clearAll()"
            >
                Clear All
            </button>


        </div>



        <!-- Week -->

        <div class="week-bar">


            <div
                class="week-title"
                id="weekTitle"
            >
            </div>



            <div class="week-buttons">


                <button
                    class="secondary-button"
                    onclick="changeWeek(-7)"
                >
                    ← Previous
                </button>


                <button
                    class="secondary-button"
                    onclick="goCurrentWeek()"
                >
                    This Week
                </button>


                <button
                    class="secondary-button"
                    onclick="changeWeek(7)"
                >
                    Next →
                </button>


            </div>


        </div>



        <!-- Availability -->

        <div class="table-wrapper">


            <table>


                <thead
                    id="tableHead"
                >
                </thead>


                <tbody
                    id="tableBody"
                >
                </tbody>


            </table>


        </div>



        <!-- Status -->

        <div
            class="submission-status"
            id="submissionStatus"
        >

            Availability submitted.

            Click Modify if you need to make changes.

        </div>



        <!-- Bottom -->

        <div class="bottom-area">


            <div class="legend">


                <div class="legend-item">

                    <div
                        class="
                            legend-box
                            legend-available
                        "
                    >
                    </div>

                    Available

                </div>



                <div class="legend-item">

                    <div
                        class="
                            legend-box
                            legend-unavailable
                        "
                    >
                    </div>

                    Unavailable

                </div>


            </div>



            <button
                class="save-button"
                id="saveButton"
                onclick="handleSubmitButton()"
            >
                Submit
            </button>


        </div>



        <div id="message">
        </div>


    </div>


</div>



<script>


/* =========================================================
   Flask data
========================================================= */

const STAFF_ID = {{ staff_id }};

const STAFF_NAME = {{ staff_name | tojson }};



/* =========================================================
   Days
========================================================= */

const DAYS = [

    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"

];



/* =========================================================
   Hour blocks
========================================================= */

const TIME_BLOCKS = [

    ["11:00", "12:00"],

    ["12:00", "13:00"],

    ["13:00", "14:00"],

    ["14:00", "15:00"],

    ["15:00", "16:00"],

    ["16:00", "17:00"],

    ["17:00", "18:00"],

    ["18:00", "19:00"],

    ["19:00", "20:00"],

    ["20:00", "21:00"]

];



let weekStart =
    getMonday(
        new Date()
    );


let isSubmitted =
    false;



/* =========================================================
   Date helpers
========================================================= */

function getMonday(date) {


    const d =
        new Date(date);


    const day =
        d.getDay();


    const diff =
        d.getDate()
        -
        day
        +
        (
            day === 0
                ? -6
                : 1
        );


    d.setDate(
        diff
    );


    d.setHours(
        0,
        0,
        0,
        0
    );


    return d;

}



function dateToString(date) {


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth()
            +
            1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year
        +
        "-"
        +
        month
        +
        "-"
        +
        day
    );

}



function displayDate(date) {


    return (
        (
            date.getMonth()
            +
            1
        )
        +
        "/"
        +
        date.getDate()
    );

}



function formatTime(time) {


    let [
        hour,
        minute
    ] = time.split(":");


    hour =
        Number(hour);


    const suffix =
        hour >= 12
            ? "PM"
            : "AM";


    let displayHour =
        hour % 12;


    if (
        displayHour === 0
    ) {

        displayHour = 12;

    }


    return (
        displayHour
        +
        ":"
        +
        minute
        +
        " "
        +
        suffix
    );

}



/* =========================================================
   Render
========================================================= */

function renderTable() {


    renderHeader();

    renderBody();

    updateWeekTitle();

}



function renderHeader() {


    const head =
        document.getElementById(
            "tableHead"
        );


    let html = `

        <tr>

            <th>
                Time
            </th>

    `;


    for (
        let i = 0;
        i < DAYS.length;
        i++
    ) {


        const date =
            new Date(
                weekStart
            );


        date.setDate(
            weekStart.getDate()
            +
            i
        );


        html += `

            <th>

                ${DAYS[i]}

                <span class="day-date">

                    ${displayDate(date)}

                </span>

            </th>

        `;

    }


    html += `

        </tr>

    `;


    head.innerHTML =
        html;

}



function renderBody() {


    const body =
        document.getElementById(
            "tableBody"
        );


    body.innerHTML =
        "";


    TIME_BLOCKS.forEach(

        block => {


            const row =
                document.createElement(
                    "tr"
                );



            const timeCell =
                document.createElement(
                    "td"
                );


            timeCell.className =
                "time-cell";


            timeCell.textContent =
                formatTime(
                    block[0]
                )
                +
                " - "
                +
                formatTime(
                    block[1]
                );


            row.appendChild(
                timeCell
            );



            for (
                let dayIndex = 0;
                dayIndex < DAYS.length;
                dayIndex++
            ) {


                const date =
                    new Date(
                        weekStart
                    );


                date.setDate(
                    weekStart.getDate()
                    +
                    dayIndex
                );



                const cell =
                    document.createElement(
                        "td"
                    );


                cell.className =
                    "availability-cell";


                cell.dataset.date =
                    dateToString(
                        date
                    );


                cell.dataset.start =
                    block[0];


                cell.dataset.end =
                    block[1];



                const text =
                    document.createElement(
                        "span"
                    );


                text.className =
                    "cell-text";


                cell.appendChild(
                    text
                );



                cell.addEventListener(

                    "click",

                    function () {


                        if (
                            isSubmitted
                        ) {

                            return;

                        }


                        this.classList.toggle(
                            "available"
                        );


                        updateCellText(
                            this
                        );

                    }

                );



                row.appendChild(
                    cell
                );

            }



            body.appendChild(
                row
            );

        }

    );



    /* Day buttons */

    const actionRow =
        document.createElement(
            "tr"
        );


    actionRow.className =
        "day-actions";



    const firstCell =
        document.createElement(
            "td"
        );


    firstCell.textContent =
        "Day";


    actionRow.appendChild(
        firstCell
    );



    for (
        let dayIndex = 0;
        dayIndex < DAYS.length;
        dayIndex++
    ) {


        const cell =
            document.createElement(
                "td"
            );



        const allButton =
            document.createElement(
                "button"
            );


        allButton.className =
            "day-action edit-control";


        allButton.textContent =
            "All";


        allButton.onclick =
            function () {


                setDay(
                    dayIndex,
                    true
                );

            };



        const clearButton =
            document.createElement(
                "button"
            );


        clearButton.className =
            "day-action edit-control";


        clearButton.textContent =
            "Clear";


        clearButton.style.marginLeft =
            "5px";


        clearButton.onclick =
            function () {


                setDay(
                    dayIndex,
                    false
                );

            };



        cell.appendChild(
            allButton
        );


        cell.appendChild(
            clearButton
        );


        actionRow.appendChild(
            cell
        );

    }



    body.appendChild(
        actionRow
    );

}



function updateCellText(cell) {


    const text =
        cell.querySelector(
            ".cell-text"
        );


    if (
        cell.classList.contains(
            "available"
        )
    ) {


        text.textContent =
            "Available";


    } else {


        text.textContent =
            "";

    }

}



function updateWeekTitle() {


    const end =
        new Date(
            weekStart
        );


    end.setDate(
        weekStart.getDate()
        +
        6
    );


    document.getElementById(
        "weekTitle"
    ).textContent =
        "Week of "
        +
        displayDate(
            weekStart
        )
        +
        " - "
        +
        displayDate(
            end
        );

}



/* =========================================================
   Week navigation
========================================================= */

function changeWeek(days) {


    weekStart.setDate(
        weekStart.getDate()
        +
        days
    );


    isSubmitted =
        false;


    renderTable();


    loadAvailability();

}



function goCurrentWeek() {


    weekStart =
        getMonday(
            new Date()
        );


    isSubmitted =
        false;


    renderTable();


    loadAvailability();

}



/* =========================================================
   Selection
========================================================= */

function selectAll() {


    if (
        isSubmitted
    ) {

        return;

    }


    document
        .querySelectorAll(
            ".availability-cell"
        )
        .forEach(

            cell => {


                cell.classList.add(
                    "available"
                );


                updateCellText(
                    cell
                );

            }

        );

}



function clearAll() {


    if (
        isSubmitted
    ) {

        return;

    }


    document
        .querySelectorAll(
            ".availability-cell"
        )
        .forEach(

            cell => {


                cell.classList.remove(
                    "available"
                );


                updateCellText(
                    cell
                );

            }

        );

}



function setDay(
    dayIndex,
    available
) {


    if (
        isSubmitted
    ) {

        return;

    }


    const rows =
        document.querySelectorAll(
            "#tableBody tr:not(.day-actions)"
        );


    rows.forEach(

        row => {


            const cell =
                row.children[
                    dayIndex
                    +
                    1
                ];


            if (
                !cell
            ) {

                return;

            }


            if (
                available
            ) {


                cell.classList.add(
                    "available"
                );


            } else {


                cell.classList.remove(
                    "available"
                );

            }


            updateCellText(
                cell
            );

        }

    );

}



/* =========================================================
   Submit / Modify state
========================================================= */

function handleSubmitButton() {


    if (
        isSubmitted
    ) {


        enableEditing();


    } else {


        saveAvailability();

    }

}



function disableEditing() {


    isSubmitted =
        true;



    document
        .querySelectorAll(
            ".availability-cell"
        )
        .forEach(

            cell => {


                cell.classList.add(
                    "locked"
                );

            }

        );



    document
        .querySelectorAll(
            ".edit-control"
        )
        .forEach(

            button => {


                button.disabled =
                    true;

            }

        );



    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.textContent =
        "Modify";


    saveButton.classList.add(
        "modify-button"
    );



    document
        .getElementById(
            "submissionStatus"
        )
        .classList.add(
            "visible"
        );

}



function enableEditing() {


    isSubmitted =
        false;



    document
        .querySelectorAll(
            ".availability-cell"
        )
        .forEach(

            cell => {


                cell.classList.remove(
                    "locked"
                );

            }

        );



    document
        .querySelectorAll(
            ".edit-control"
        )
        .forEach(

            button => {


                button.disabled =
                    false;

            }

        );



    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.textContent =
        "Submit";


    saveButton.classList.remove(
        "modify-button"
    );



    document
        .getElementById(
            "submissionStatus"
        )
        .classList.remove(
            "visible"
        );

}



/* =========================================================
   Load availability
========================================================= */

async function loadAvailability() {


    clearAll();



    const url =
        "/api/staff-availability"
        +
        "?staff_id="
        +
        encodeURIComponent(
            STAFF_ID
        )
        +
        "&week_start="
        +
        encodeURIComponent(
            dateToString(
                weekStart
            )
        );



    try {


        const response =
            await fetch(
                url
            );


        const data =
            await response.json();



        if (
            !data.success
        ) {


            showMessage(
                data.message
                ||
                "Unable to load availability.",
                false
            );


            return;

        }



        data.availability.forEach(

            item => {


                if (
                    !item.is_available
                ) {

                    return;

                }



                const start =
                    String(
                        item.start_time
                    ).substring(
                        0,
                        5
                    );


                const end =
                    String(
                        item.end_time
                    ).substring(
                        0,
                        5
                    );



                const selector =
                    '.availability-cell'
                    +
                    '[data-date="'
                    +
                    item.work_date
                    +
                    '"]'
                    +
                    '[data-start="'
                    +
                    start
                    +
                    '"]'
                    +
                    '[data-end="'
                    +
                    end
                    +
                    '"]';



                const cell =
                    document.querySelector(
                        selector
                    );



                if (
                    cell
                ) {


                    cell.classList.add(
                        "available"
                    );


                    updateCellText(
                        cell
                    );

                }

            }

        );


    } catch (
        error
    ) {


        console.error(
            error
        );


        showMessage(
            "Unable to load availability.",
            false
        );

    }

}



/* =========================================================
   Save
========================================================= */

async function saveAvailability() {


    const entries =
        [];



    document
        .querySelectorAll(
            ".availability-cell"
        )
        .forEach(

            cell => {


                entries.push({

                    work_date:
                        cell.dataset.date,

                    start_time:
                        cell.dataset.start,

                    end_time:
                        cell.dataset.end,

                    is_available:
                        cell.classList.contains(
                            "available"
                        )

                });

            }

        );



    const saveButton =
        document.getElementById(
            "saveButton"
        );



    saveButton.disabled =
        true;


    saveButton.textContent =
        "Submitting...";



    try {


        const response =
            await fetch(

                "/api/staff-availability",

                {


                    method:
                        "POST",


                    headers: {

                        "Content-Type":
                            "application/json"

                    },


                    body:
                        JSON.stringify({

                            staff_id:
                                STAFF_ID,

                            availability:
                                entries

                        })

                }

            );



        const data =
            await response.json();



        if (
            data.success
        ) {


            showMessage(
                "Availability submitted successfully.",
                true
            );


            disableEditing();


        } else {


            showMessage(
                data.message
                ||
                "Unable to submit availability.",
                false
            );


            saveButton.textContent =
                "Submit";

        }


    } catch (
        error
    ) {


        console.error(
            error
        );


        showMessage(
            "Unable to connect to server.",
            false
        );


        saveButton.textContent =
            "Submit";


    } finally {


        saveButton.disabled =
            false;

    }

}



/* =========================================================
   Message
========================================================= */

function showMessage(
    message,
    success
) {


    const element =
        document.getElementById(
            "message"
        );



    element.className =
        success
            ? "success"
            : "error";


    element.textContent =
        message;


    element.style.display =
        "block";



    setTimeout(

        function () {


            element.style.display =
                "none";


            element.className =
                "";

        },

        4000

    );

}



/* =========================================================
   Start
========================================================= */

renderTable();

loadAvailability();


</script>
