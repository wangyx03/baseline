<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 40px;

            border-radius: 8px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 32px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;

            font-size: 16px;

            border: 1px solid #aaa;
            border-radius: 4px;
        }

        input:focus {
            outline: 2px solid #333;
        }

        button {
            width: 100%;
            padding: 12px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            border: none;
            border-radius: 4px;

            background: #111;
            color: white;
        }

        button:hover {
            background: #333;
        }

        .error {
            background: #ffeaea;
            color: #c00000;

            padding: 10px;
            margin-bottom: 20px;

            border-radius: 4px;
        }
    </style>
</head>


<body>

<div class="login-box">

    <h1>Login</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label for="username">
            Username
        </label>

        <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autofocus
        >


        <label for="password">
            Password
        </label>

        <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
