<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Operations
        {% endblock %}
    </title>

    <!-- Common Navbar CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='navbar.css') }}"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f6f8;

            color: #1f2329;
        }

        {% block styles %}
        {% endblock %}

    </style>

</head>

<body>

    {% block navbar %}
        {% include "navbar.html" %}
    {% endblock %}

    {% block content %}
    {% endblock %}

    {% block scripts %}
    {% endblock %}

</body>

</html>
