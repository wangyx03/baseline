<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weekly Inventory Monitor Demo</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            padding: 28px 20px 50px 20px;
        }


        h1 {
            margin: 0 0 30px 0;
            font-size: 42px;
        }


        /* =====================================================
           CONTROL PANEL
        ===================================================== */

        .controls {
            background: white;
            padding: 28px 30px;
            border-radius: 10px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }


        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        .control-group label {
            font-weight: bold;
            font-size: 18px;
        }


        select,
        input {
            font-family: inherit;
        }


        #weekId {
            width: 260px;
            padding: 13px 16px;
            font-size: 18px;
            border: 1px solid #999;
            border-radius: 4px;
            background: white;
        }


        #storeId {
            width: 220px;
            padding: 13px 16px;
            font-size: 18px;
            border: 1px solid #999;
            border-radius: 4px;
            background: white;
        }


        button {
            padding: 13px 20px;
            font-size: 17px;
            background: white;
            border: 1px solid #aaa;
            border-radius: 7px;
            cursor: pointer;
        }


        button:hover:not(:disabled) {
            background: #eee;
        }


        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        .filter-button.active {
            background: #111;
            color: white;
            border-color: #111;
        }


        /* =====================================================
           REFRESH INFO
        ===================================================== */

        .refresh-info {
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 15px 2px 0 2px;
            color: #666;
            font-size: 14px;
        }


        .refresh-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2c9c4b;
            margin-right: 5px;
        }


        /* =====================================================
           SUMMARY
        ===================================================== */

        .summary-grid {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            margin-top: 35px;
            margin-bottom: 28px;
        }


        .summary-card {
            width: 225px;
            background: white;
            padding: 22px 30px;
            border-radius: 12px;
        }


        .summary-label {
            color: #555;
            font-size: 17px;
            margin-bottom: 8px;
        }


        .summary-value {
            font-size: 34px;
            font-weight: bold;
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-row {
            margin-bottom: 22px;
        }


        #searchInput {
            width: 525px;
            max-width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            border: 1px solid #888;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }


        th,
        td {
            padding: 15px 16px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }


        th {
            background: #eee;
            font-size: 16px;
        }


        td {
            font-size: 16px;
        }


        .number {
            text-align: right;
        }


        .sortable {
            cursor: pointer;
            user-select: none;
        }


        .sortable:hover {
            background: #ddd;
        }


        .sort-indicator {
            display: inline-block;
            width: 16px;
            margin-left: 5px;
            text-align: center;
        }


        .remaining-zero {
            font-weight: bold;
            color: #fff;
            background: #dc3545 !important;
            border-radius: 6px;
        }


        .stock-warning td {
            background: #fff3cd;
        }

        .stock-danger td {
            background: #f8d7da;
        }


        .empty-row {
            padding: 28px;
            color: #777;
        }


        /* =====================================================
           STATUS / ERROR
        ===================================================== */

        #errorMessage {
            margin-top: 20px;
            color: #b00020;
            font-size: 16px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            h1 {
                font-size: 32px;
            }


            .controls {
                flex-direction: column;
                align-items: stretch;
            }


            #weekId,
            #storeId {
                width: 100%;
            }


            .summary-card {
                width: 100%;
            }


        }


        .inventory-filter-picker { position: relative; min-width: 165px; }
        #usedFilterButton, #plannedFilterButton { min-width: 165px; display: flex; justify-content: space-between; gap: 10px; align-items: center; background: white; padding: 13px 14px; }
        .inventory-filter-menu { position: absolute; z-index: 100; top: calc(100% + 2px); left: 0; width: 280px; background: white; border: 1px solid #cbd5e1; border-radius: 9px; box-shadow: 0 8px 24px #0002; padding: 10px 0; }
        .inventory-filter-menu[hidden] { display: none; }
        .inventory-filter-menu label { display: flex; align-items: center; gap: 12px; padding: 11px 16px; font-size: 16px; font-weight: normal; cursor: pointer; }
        .inventory-filter-menu label:hover { background: #f2f5f9; }
        .inventory-filter-menu input { width: 18px; height: 18px; accent-color: #1677ed; }

    </style>

</head>


<body>


{% include "navbar.html" %}


<!-- =========================================================
     PAGE
========================================================= -->

<div class="page">


    <h1>
        Weekly Inventory Monitor Demo
    </h1>


    <!-- =====================================================
         CONTROLS
    ===================================================== -->

    <div class="controls">


        <div class="control-group">
            <label for="inventorySource">Inventory</label>
            <select id="inventorySource" style="padding:13px 16px;font-size:18px;">
                <option value="M6">M6</option>
                <option value="WOOKOO">Wookoo</option>
            </select>
        </div>
        <!-- WEEK -->

        <div class="control-group" id="weekControl">

            <label for="weekId">
                Week
            </label>

            <select id="weekId">

                <option value="">
                    Loading...
                </option>

            </select>

        </div>


        <!-- STORE -->

        <div class="control-group">

            <label for="storeId">
                Store
            </label>

            <select id="storeId">

                <option value="1">
                    TU
                </option>

                <option value="2">
                    VB
                </option>

            </select>

        </div>


        <!-- LOAD -->

        <button
            type="button"
            id="loadButton"
            onclick="loadInventory()"
        >
            Load
        </button>


        <!-- TWO INDEPENDENT MULTI-SELECT FILTERS -->
        <div class="control-group">
            <label>Used (multiple)</label>
            <div class="inventory-filter-picker" id="usedFilterPicker">
                <button type="button" id="usedFilterButton" aria-expanded="false" onclick="toggleQuantityFilter('used')"><span id="usedFilterLabel">Used: All</span> ▾</button>
                <div id="usedFilterMenu" class="inventory-filter-menu" hidden>
                    <label><input type="checkbox" id="usedAll" checked onchange="changeQuantityFilter('used','all',this.checked)"> All</label>
                    <label><input type="checkbox" id="usedZero" checked onchange="changeQuantityFilter('used','zero',this.checked)"> Used = 0</label>
                    <label><input type="checkbox" id="usedPositive" checked onchange="changeQuantityFilter('used','positive',this.checked)"> Used &gt; 0</label>
                </div>
            </div>
        </div>
        <div class="control-group">
            <label>Planned (multiple)</label>
            <div class="inventory-filter-picker" id="plannedFilterPicker">
                <button type="button" id="plannedFilterButton" aria-expanded="false" onclick="toggleQuantityFilter('planned')"><span id="plannedFilterLabel">Planned: All</span> ▾</button>
                <div id="plannedFilterMenu" class="inventory-filter-menu" hidden>
                    <label><input type="checkbox" id="plannedAll" checked onchange="changeQuantityFilter('planned','all',this.checked)"> All</label>
                    <label><input type="checkbox" id="plannedZero" checked onchange="changeQuantityFilter('planned','zero',this.checked)"> Planned = 0</label>
                    <label><input type="checkbox" id="plannedPositive" checked onchange="changeQuantityFilter('planned','positive',this.checked)"> Planned &gt; 0</label>
                </div>
            </div>
        </div>
        <button type="button" id="filterInStock" class="filter-button" aria-pressed="false" onclick="toggleInStock()">In Stock</button>

    </div>


    <!-- =====================================================
         AUTO REFRESH INFO
    ===================================================== -->

    <div class="refresh-info">

        <span>
            Last Updated:
            <strong id="lastUpdated">
                —
            </strong>
        </span>

    </div>


    <!-- =====================================================
         SUMMARY
    ===================================================== -->

    <div class="summary-grid">


        <div class="summary-card">

            <div class="summary-label">
                Total SKU
            </div>

            <div
                class="summary-value"
                id="totalSku"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Never Used
            </div>

            <div
                class="summary-value"
                id="neverUsed"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Total Planned
            </div>

            <div
                class="summary-value"
                id="totalPlanned"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Total Used
            </div>

            <div
                class="summary-value"
                id="totalUsed"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Total Remaining
            </div>

            <div
                class="summary-value"
                id="totalRemaining"
            >
                0
            </div>

        </div>


    </div>


    <!-- =====================================================
         SEARCH
    ===================================================== -->

    <div class="search-row">

        <input
            type="text"
            id="searchInput"
            placeholder="Search SKU, title or author"
        >

    </div>


    <!-- =====================================================
         ERROR
    ===================================================== -->

    <div id="errorMessage"></div>


    <!-- =====================================================
         TABLE
    ===================================================== -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th class="sortable" onclick="sortInventory('sku')">
                        SKU
                    </th>

                    <th class="sortable" onclick="sortInventory('title')">
                        Title
                    </th>

                    <th class="sortable" onclick="sortInventory('author')">
                        Author
                    </th>

                    {% if can_view_actual_stock %}

                    <th id="actualStockHeader"
                        class="number sortable"
                        onclick="sortInventory('actual_stock')"
                    >
                        Actual Stock
                        <span
                            id="sort-actual_stock"
                            class="sort-indicator"
                        ></span>
                    </th>

                    {% endif %}

                    <th
                        class="number sortable"
                        onclick="sortInventory('planned')"
                    >
                        Planned
                        <span
                            id="sort-planned"
                            class="sort-indicator"
                        ></span>
                    </th>

                    <th
                        class="number sortable"
                        onclick="sortInventory('used')"
                    >
                        Used
                        <span
                            id="sort-used"
                            class="sort-indicator"
                        ></span>
                    </th>

                    <th
                        class="number sortable"
                        onclick="sortInventory('remaining')"
                    >
                        Remaining
                        <span
                            id="sort-remaining"
                            class="sort-indicator"
                        ></span>
                    </th>

                </tr>

            </thead>


            <tbody id="inventoryBody">

                <tr>

                    <td
                        colspan="{{ 7 if can_view_actual_stock else 6 }}"
                        class="empty-row"
                    >
                        Loading inventory...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>


<script>


const inventorySourceSelect = document.getElementById("inventorySource");
const weekControl = document.getElementById("weekControl");

const CAN_VIEW_ACTUAL_STOCK =
    {{ can_view_actual_stock | tojson }};


const INVENTORY_COLUMN_COUNT = 7;


// =========================================================
// SETTINGS
// =========================================================

const STORAGE_WEEK_KEY =
    "weeklyInventoryWeek";


const STORAGE_STORE_KEY =
    "weeklyInventoryStore";

const STORAGE_SOURCE_KEY = "weeklyInventorySource";


const AUTO_REFRESH_MS =
    15000;


let autoRefreshTimer =
    null;


let lastInventoryVersion =
    null;


let inventoryVersionCheckRunning =
    false;


let allItems =
    [];


let quantityFilters = {used: new Set(["zero", "positive"]), planned: new Set(["zero", "positive"])};
let inStockOnly = false;


let loadingInventory =
    false;


let sortColumn =
    null;


let sortDirection =
    "asc";


// =========================================================
// ELEMENTS
// =========================================================

const weekSelect =
    document.getElementById(
        "weekId"
    );


const storeSelect =
    document.getElementById(
        "storeId"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const inventoryBody =
    document.getElementById(
        "inventoryBody"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const lastUpdated =
    document.getElementById(
        "lastUpdated"
    );


// =========================================================
// SAVE SELECTION
// =========================================================

function saveCurrentSelection() {


    const weekId =
        weekSelect.value;


    const storeId =
        storeSelect.value;


    if (weekId) {

        localStorage.setItem(
            STORAGE_WEEK_KEY,
            weekId
        );

    }


    if (storeId) {

        localStorage.setItem(
            STORAGE_STORE_KEY,
            storeId
        );

    }

}


// =========================================================
// RESTORE STORE
// =========================================================

function restoreStore() {


    const savedStore =
        localStorage.getItem(
            STORAGE_STORE_KEY
        );


    if (!savedStore) {
        return;
    }


    const exists =
        Array.from(
            storeSelect.options
        )
        .some(
            option =>
                option.value
                ===
                savedStore
        );


    if (exists) {

        storeSelect.value =
            savedStore;

    }

}


// =========================================================
// LOAD WEEKS
// =========================================================

async function loadWeeks() {


    const savedWeek =
        localStorage.getItem(
            STORAGE_WEEK_KEY
        );


    const storeId =
        storeSelect.value;


    try {


        const response =
            await fetch(

                "/api/weekly-weeks"

                + "?store_id="

                + encodeURIComponent(
                    storeId
                )

            );


        const data =
            await response.json();


        if (
            !response.ok
            ||
            !data.success
        ) {


            errorMessage.textContent =
                data.message
                ||
                "Could not load weeks.";


            return;

        }


        weekSelect.innerHTML =
            "";


        if (
            !data.weeks
            ||
            data.weeks.length === 0
        ) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                "";


            option.textContent =
                "No weekly inventory";


            weekSelect.appendChild(
                option
            );


            return;

        }


        for (
            const week
            of data.weeks
        ) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                week;


            option.textContent =
                week;


            weekSelect.appendChild(
                option
            );

        }


        // -----------------------------------------------------
        // Restore previous week if still available
        // -----------------------------------------------------

        if (
            savedWeek
            &&
            data.weeks.includes(
                savedWeek
            )
        ) {


            weekSelect.value =
                savedWeek;


        } else {


            // Database latest week
            weekSelect.value =
                data.weeks[0];

        }


        saveCurrentSelection();


    }

    catch (error) {


        console.error(
            error
        );


        errorMessage.textContent =
            "Could not load weeks.";

    }

}


// =========================================================
// LOAD INVENTORY
// =========================================================

async function loadInventory() {


    if (loadingInventory) {
        return;
    }


    const weekId =
        weekSelect.value;


    const storeId =
        storeSelect.value;


    if ((!weekId && inventorySourceSelect.value === "M6") || !storeId) {

        return;

    }


    loadingInventory =
        true;


    errorMessage.textContent =
        "";


    saveCurrentSelection();


    try {


        const url =

            (inventorySourceSelect.value === "WOOKOO" ? "/api/wookoo-inventory" : "/api/weekly-inventory")

            + "?week_id="

            + encodeURIComponent(
                weekId
            )

            + "&store_id="

            + encodeURIComponent(
                storeId
            );


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok
            ||
            !data.success
        ) {


            errorMessage.textContent =
                data.message
                ||
                "Could not load inventory.";


            return;

        }


        allItems =
            data.items
            ||
            [];


        lastInventoryVersion =
            Number(
                data.version
                ||
                0
            );


        updateSummary();


        renderInventory();


        updateLastUpdatedTime();


    }

    catch (error) {


        console.error(
            error
        );


        errorMessage.textContent =
            "Could not load inventory.";

    }

    finally {


        loadingInventory =
            false;

    }

}


// =========================================================
// SUMMARY
// =========================================================

function updateSummary() {


    let totalSku =
        allItems.length;


    let neverUsed =
        0;


    let totalPlanned =
        0;


    let totalUsed =
        0;


    let totalRemaining =
        0;


    for (
        const item
        of allItems
    ) {


        const planned =
            Number(
                item.planned
                ||
                0
            );


        const used =
            Number(
                item.used
                ||
                0
            );


        const remaining =
            Number(
                item.remaining
                ||
                0
            );


        if (used === 0) {

            neverUsed += 1;

        }


        totalPlanned +=
            planned;


        totalUsed +=
            used;


        totalRemaining +=
            remaining;

    }


    document
        .getElementById(
            "totalSku"
        )
        .textContent =
            totalSku;


    document
        .getElementById(
            "neverUsed"
        )
        .textContent =
            neverUsed;


    document
        .getElementById(
            "totalPlanned"
        )
        .textContent =
            totalPlanned;


    document
        .getElementById(
            "totalUsed"
        )
        .textContent =
            totalUsed;


    document
        .getElementById(
            "totalRemaining"
        )
        .textContent =
            totalRemaining;

}


// =========================================================
// FILTER
// =========================================================

function toggleQuantityFilter(type) {
    const menu = document.getElementById(type + "FilterMenu");
    const opening = menu.hidden;
    ["used", "planned"].forEach(t => {
        document.getElementById(t + "FilterMenu").hidden = true;
        document.getElementById(t + "FilterButton").setAttribute("aria-expanded", "false");
    });
    menu.hidden = !opening;
    document.getElementById(type + "FilterButton").setAttribute("aria-expanded", String(opening));
}

document.addEventListener("click", event => {
    ["used", "planned"].forEach(type => {
        if (!document.getElementById(type + "FilterPicker").contains(event.target)) {
            document.getElementById(type + "FilterMenu").hidden = true;
            document.getElementById(type + "FilterButton").setAttribute("aria-expanded", "false");
        }
    });
});

function changeQuantityFilter(type, option, checked) {
    const selected = quantityFilters[type];
    if (option === "all") {
        selected.clear();
        if (checked) { selected.add("zero"); selected.add("positive"); }
    } else if (checked) {
        selected.add(option);
    } else {
        selected.delete(option);
    }
    document.getElementById(type + "All").checked = selected.size === 2;
    document.getElementById(type + "Zero").checked = selected.has("zero");
    document.getElementById(type + "Positive").checked = selected.has("positive");
    const name = type === "used" ? "Used" : "Planned";
    document.getElementById(type + "FilterLabel").textContent = name + ": " + (
        selected.size === 2 ? "All" : selected.size === 0 ? "None" :
        selected.has("zero") ? name + " = 0" : name + " > 0"
    );
    renderInventory();
}

function toggleInStock() {
    inStockOnly = !inStockOnly;
    const button = document.getElementById("filterInStock");
    button.classList.toggle("active", inStockOnly);
    button.setAttribute("aria-pressed", String(inStockOnly));
    renderInventory();
}

// =========================================================
// SORT
// =========================================================

function sortInventory(
    column
) {

    if (
        sortColumn === column
    ) {

        sortDirection =
            sortDirection === "asc"
            ? "desc"
            : "asc";

    } else {

        sortColumn =
            column;

        sortDirection =
            "asc";
    }

    updateSortIndicators();

    renderInventory();

}


function updateSortIndicators() {

    const columns = [
        "actual_stock",
        "planned",
        "used",
        "remaining"
    ];

    for (
        const column
        of columns
    ) {

        const element =
            document.getElementById(
                "sort-" + column
            );

        if (!element) {
            continue;
        }

        if (
            column !== sortColumn
        ) {

            element.textContent =
                "";

            continue;
        }

        element.textContent =
            sortDirection === "asc"
            ? "▲"
            : "▼";
    }

}


// =========================================================
// RENDER INVENTORY
// =========================================================

function renderInventory() {


    const search =
        searchInput.value
        .trim()
        .toLowerCase();


    let rows =
        allItems.filter(
            item => {


                const sku =
                    String(
                        item.sku
                        ||
                        ""
                    )
                    .toLowerCase();


                const title =
                    String(
                        item.title
                        ||
                        ""
                    )
                    .toLowerCase();


                const author =
                    String(
                        item.author
                        ||
                        ""
                    )
                    .toLowerCase();


                const used =
                    Number(
                        item.used
                        ||
                        0
                    );


                const remaining =
                    Number(
                        item.remaining
                        ||
                        0
                    );


                // Search

                if (
                    search
                    &&
                    !sku.includes(
                        search
                    )
                    &&
                    !title.includes(
                        search
                    )
                    &&
                    !author.includes(
                        search
                    )
                ) {

                    return false;

                }


                const usedChoices = quantityFilters.used;
                const plannedChoices = quantityFilters.planned;
                const planned = Number(item.planned || 0);
                if (!(usedChoices.has("zero") && used === 0 || usedChoices.has("positive") && used > 0)) return false;
                if (!(plannedChoices.has("zero") && planned === 0 || plannedChoices.has("positive") && planned > 0)) return false;
                if (inStockOnly && remaining <= 0) return false;

                return true;

            }
        );


    if (sortColumn) {
        const textColumns = ["sku", "title", "author"];
        rows.sort((a, b) => {
            let comparison;
            if (textColumns.includes(sortColumn)) {
                comparison = String(a[sortColumn] ?? "").localeCompare(
                    String(b[sortColumn] ?? ""),
                    undefined,
                    { numeric: true, sensitivity: "base" }
                );
            } else {
                comparison = Number(a[sortColumn] || 0) - Number(b[sortColumn] || 0);
            }
            return sortDirection === "asc" ? comparison : -comparison;
        });
    }


    inventoryBody.innerHTML =
        "";


    if (
        rows.length === 0
    ) {


        inventoryBody.innerHTML = `

            <tr>

                <td
                    colspan="${CAN_VIEW_ACTUAL_STOCK && inventorySourceSelect.value === 'M6' ? 7 : 6}"
                    class="empty-row"
                >

                    No matching inventory

                </td>

            </tr>

        `;


        return;

    }


    for (
        const item
        of rows
    ) {


        const tr =
            document.createElement(
                "tr"
            );


        const remaining =
            Number(
                item.remaining
                ||
                0
            );


        const actualStock =
            Number(
                item.actual_stock
                ||
                0
            );


        const stockDifference =
            actualStock - remaining;

        if (
            CAN_VIEW_ACTUAL_STOCK && inventorySourceSelect.value === "M6"
            &&
            stockDifference <= 0
        ) {

            tr.classList.add(
                "stock-danger"
            );

        } else if (
            CAN_VIEW_ACTUAL_STOCK && inventorySourceSelect.value === "M6"
            &&
            stockDifference < 5
        ) {

            tr.classList.add(
                "stock-warning"
            );
        }


        tr.innerHTML = `

            <td>
                ${escapeHtml(item.sku)}
            </td>

            <td>
                ${escapeHtml(item.title || "")}
            </td>

            <td>
                ${escapeHtml(item.author || "")}
            </td>

            ${
                CAN_VIEW_ACTUAL_STOCK && inventorySourceSelect.value === "M6"
                ? `
                    <td class="number">
                        ${Number(item.actual_stock || 0)}
                    </td>
                `
                : ""
            }

            <td class="number">
                ${Number(item.planned || 0)}
            </td>

            <td class="number">
                ${Number(item.used || 0)}
            </td>

            <td
                class="
                    number
                    ${remaining <= 0
                        ? "remaining-zero"
                        : ""}
                "
            >
                ${remaining}
            </td>

        `;


        inventoryBody.appendChild(
            tr
        );

    }

}


// =========================================================
// LAST UPDATED
// =========================================================

function updateLastUpdatedTime() {


    const now =
        new Date();


    lastUpdated.textContent =
        now.toLocaleTimeString(
            [],
            {
                hour:
                    "numeric",

                minute:
                    "2-digit",

                second:
                    "2-digit"
            }
        );

}


// =========================================================
// AUTO REFRESH
// =========================================================

async function checkInventoryVersion() {


    if (
        inventoryVersionCheckRunning
    ) {

        return;

    }


    const weekId =
        weekSelect.value;


    const storeId =
        storeSelect.value;


    if ((!weekId && inventorySourceSelect.value === "M6") || !storeId) {

        return;

    }


    inventoryVersionCheckRunning =
        true;


    try {


        const response =
            await fetch(

                (inventorySourceSelect.value === "WOOKOO" ? "/api/wookoo-inventory/version" : "/api/weekly-inventory/version")

                + "?week_id="

                + encodeURIComponent(
                    weekId
                )

                + "&store_id="

                + encodeURIComponent(
                    storeId
                ),

                {
                    cache: "no-store"
                }

            );


        const data =
            await response.json();


        if (
            !response.ok
            ||
            !data.success
        ) {

            return;

        }


        const version =
            Number(
                data.version
                ||
                0
            );


        if (
            lastInventoryVersion
            ===
            null
        ) {

            lastInventoryVersion =
                version;

            return;

        }


        if (
            version
            !==
            lastInventoryVersion
        ) {

            await loadInventory();

        }


    }

    catch (error) {


        console.error(
            "Weekly inventory version check failed:",
            error
        );


    }

    finally {


        inventoryVersionCheckRunning =
            false;

    }

}


function startAutoRefresh() {


    if (
        autoRefreshTimer
    ) {


        clearInterval(
            autoRefreshTimer
        );

    }


    autoRefreshTimer =
        setInterval(
            checkInventoryVersion,
            AUTO_REFRESH_MS
        );

}


// =========================================================
// STORE CHANGE
// =========================================================

storeSelect.addEventListener(

    "change",

    async function() {


        /*
        Save the new store immediately.
        */

        localStorage.setItem(
            STORAGE_STORE_KEY,
            storeSelect.value
        );


        lastInventoryVersion =
            null;


        /*
        Load weeks available for this store.

        If previous Week also exists in the new Store,
        it will remain selected.

        Otherwise latest available Week is selected.
        */

        await loadWeeks();


        await loadInventory();

    }

);


// =========================================================
// WEEK CHANGE
// =========================================================

weekSelect.addEventListener(

    "change",

    async function() {


        saveCurrentSelection();


        lastInventoryVersion =
            null;


        await loadInventory();

    }

);


// =========================================================
// SEARCH
// =========================================================

searchInput.addEventListener(

    "input",

    function() {


        renderInventory();

    }

);


// =========================================================
// ESCAPE
// =========================================================

function escapeHtml(
    value
) {


    return String(
        value
        ??
        ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


// =========================================================
// PAGE LOAD
// =========================================================

window.addEventListener(

    "load",

    async function() {


        /*
        1. Restore Store first.

        Example:
        Last time = VB
        F5 → VB remains selected.
        */

        restoreStore();

        const savedSource = localStorage.getItem(STORAGE_SOURCE_KEY);
        if (savedSource === "M6" || savedSource === "WOOKOO") {
            inventorySourceSelect.value = savedSource;
        }
        weekControl.style.display = inventorySourceSelect.value === "WOOKOO" ? "none" : "";
        const actualHeader = document.getElementById("actualStockHeader");
        if (actualHeader) actualHeader.style.display = inventorySourceSelect.value === "WOOKOO" ? "none" : "";

        /*
        2. Load available Weeks for that Store.

        Previous Week is restored if still available.
        */

        await loadWeeks();


        /*
        3. Load inventory immediately.
        */

        await loadInventory();


        /*
        4. Start 15-second refresh.
        */

        startAutoRefresh();

    }

);


inventorySourceSelect.addEventListener("change", () => {
    localStorage.setItem(STORAGE_SOURCE_KEY, inventorySourceSelect.value);
    weekControl.style.display = inventorySourceSelect.value === "WOOKOO" ? "none" : "";
    const actualHeader = document.getElementById("actualStockHeader");
    if (actualHeader) actualHeader.style.display = inventorySourceSelect.value === "WOOKOO" ? "none" : "";
    lastInventoryVersion = null;
    loadInventory();
});
</script>
